<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luan Baterias</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #0c0c0d; overflow: hidden; }
    #site { width: 100%; height: 100%; border: 0; display: block; background: #0c0c0d; }
  </style>
</head>
<body>
  <iframe id="site" src="./luan%20bat%20hero%20final.html" title="Luan Baterias"></iframe>

  <script>
    const frame = document.getElementById('site');

    frame.addEventListener('load', () => {
      const doc = frame.contentDocument || frame.contentWindow.document;
      if (!doc) return;

      const font = doc.createElement('link');
      font.rel = 'stylesheet';
      font.href = 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700;800;900&display=swap';
      doc.head.appendChild(font);

      const style = doc.createElement('style');
      style.textContent = `
        body, button, input, select, textarea, nav a,
        .hero-desc, .eyebrow, .subhead, .search-card,
        .cta-btn, .region, .tag {
          font-family: 'Inter', sans-serif !important;
        }

        h1, .logo-text .brand {
          font-family: 'Inter Tight', sans-serif !important;
        }

        h1 {
          font-weight: 800 !important;
          letter-spacing: -0.025em !important;
          line-height: 0.99 !important;
          max-width: 620px;
        }

        h1 .line2 {
          font-weight: 800 !important;
          margin-top: 4px;
          background: none !important;
          color: #ffd21a !important;
          -webkit-text-fill-color: #ffd21a !important;
        }

        .eyebrow {
          letter-spacing: 1.8px !important;
        }

        .subhead span {
          font-family: 'Inter', sans-serif !important;
          font-weight: 700 !important;
          letter-spacing: 2.6px !important;
        }

        .hero-desc {
          line-height: 1.55 !important;
          max-width: 565px;
          color: #e6e6e8 !important;
        }

        .search-head h3 {
          font-family: 'Inter', sans-serif !important;
          font-weight: 700 !important;
        }

        .search-submit {
          font-family: 'Inter', sans-serif !important;
          font-weight: 800 !important;
          letter-spacing: -0.01em !important;
        }

        .secure-note { display: none !important; }
      `;
      doc.head.appendChild(style);

      const eyebrow = doc.querySelector('.eyebrow');
      if (eyebrow) eyebrow.innerHTML = 'ATENDIMENTO NA LOJA <span class="dot">|</span> ENTREGA RÁPIDA <span class="dot">|</span> INSTALAÇÃO';

      const title = doc.querySelector('h1');
      if (title) title.innerHTML = 'Precisou de bateria?<span class="line2">A gente resolve.</span>';

      const subhead = doc.querySelector('.subhead span');
      if (subhead) subhead.textContent = 'NA LOJA OU ONDE VOCÊ ESTIVER.';

      const desc = doc.querySelector('.hero-desc');
      if (desc) desc.textContent = 'Baterias de confiança, instalação profissional e garantia para manter você em movimento.';

      const searchTitle = doc.querySelector('.search-head h3');
      if (searchTitle) searchTitle.textContent = 'Encontre a bateria certa para o seu veículo';

      const searchText = doc.querySelector('.search-head p');
      if (searchText) searchText.textContent = 'Selecione seu veículo e veja as opções compatíveis.';

      const searchButton = doc.querySelector('.search-submit');
      if (searchButton) {
        const textNode = [...searchButton.childNodes].find(node => node.nodeType === 3 && node.textContent.trim());
        if (textNode) textNode.textContent = ' ENCONTRAR MINHA BATERIA ';
      }
    });
  </script>
</body>
</html>
