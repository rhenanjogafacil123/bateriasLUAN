<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Luan Baterias</title>
  <style>
    html,body{margin:0;width:100%;min-height:100%;background:#0c0c0d;overflow-x:hidden}
    #page{width:100%;height:100vh;min-height:840px;border:0;display:block;background:#0c0c0d}
  </style>
</head>
<body>
  <iframe id="page" src="./site-v2.html" title="Luan Baterias"></iframe>
  <script>
    const page = document.getElementById('page');
    const WHATSAPP_NUMBER = '5521977449687';
    const PHONE_NUMBER = '+552133052797';
    const ADDRESS = 'Rua do Império, 166 - Santa Cruz - RJ';
    const MAP_QUERY = 'Rua do Império, 166, Santa Cruz, Rio de Janeiro, RJ';

    const waUrl = (message) => `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(message)}`;

    page.addEventListener('load', () => {
      const doc = page.contentDocument || page.contentWindow.document;
      if (!doc) return;

      const style = doc.createElement('style');
      style.textContent = `
        .proof .head{margin-bottom:30px}
        .proof-grid{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:14px!important}
        .testimonial-card{position:relative;min-height:250px;padding:24px;border:1px solid rgba(255,255,255,.09);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.032),rgba(255,255,255,.015));display:flex;flex-direction:column;transition:transform .2s ease,border-color .2s ease}
        .testimonial-card:hover{transform:translateY(-3px);border-color:rgba(255,210,26,.24)}
        .testimonial-top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}
        .testimonial-stars{color:#ffd21a;letter-spacing:2px;font-size:14px}
        .testimonial-type{font-size:9px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:#8f9096}
        .testimonial-quote{margin:0 0 26px!important;color:#ececef!important;font-size:14px!important;line-height:1.7!important;flex:1}
        .testimonial-person{display:flex;align-items:center;gap:11px;padding-top:17px;border-top:1px solid rgba(255,255,255,.07)}
        .testimonial-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,210,26,.10);border:1px solid rgba(255,210,26,.18);color:#ffd21a;font-weight:800;font-size:12px}
        .testimonial-name{font-size:12px;font-weight:800;color:#fff}
        .testimonial-meta{margin-top:2px;font-size:10.5px;color:#85868c}
        .demo-note{display:flex;align-items:center;gap:8px;margin-top:18px;color:#777981;font-size:10.5px;line-height:1.5}
        .demo-dot{width:6px;height:6px;border-radius:50%;background:#ffd21a;flex:0 0 auto}
        .map{padding:0!important;overflow:hidden!important;position:relative!important}
        .map:before,.map:after{display:none!important}
        .map iframe{width:100%;height:100%;min-height:360px;border:0;display:block;filter:grayscale(.38) contrast(1.05) brightness(.8)}
        .map-route{position:absolute;left:18px;bottom:18px;z-index:3;min-height:42px;padding:0 15px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;background:#ffd21a;color:#111214;text-decoration:none;font-size:12px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.28)}
        .contact a.inline-link{color:#f5f5f3;text-decoration:none;font-weight:700}
        .contact a.inline-link:hover{color:#ffd21a}
        .wa-float{position:fixed;right:22px;bottom:22px;z-index:9999;min-height:52px;padding:0 18px;border-radius:999px;display:flex;align-items:center;gap:9px;background:#ffd21a;color:#111214;text-decoration:none;font-size:12px;font-weight:900;letter-spacing:-.01em;border:1px solid rgba(0,0,0,.18);box-shadow:0 16px 40px rgba(0,0,0,.34)}
        .wa-float:hover{transform:translateY(-2px)}
        .wa-float span{font-size:18px;line-height:1}
        @media(max-width:980px){.proof-grid{grid-template-columns:1fr!important}}
        @media(max-width:640px){.wa-float{right:14px;bottom:14px;min-height:48px;padding:0 14px}.map iframe{min-height:320px}.map-route{left:14px;bottom:14px}}
      `;
      doc.head.appendChild(style);

      const proof = doc.querySelector('#avaliacoes');
      if (proof) {
        proof.innerHTML = `
          <div class="container">
            <div class="kicker">Quem compra, recomenda</div>
            <div class="head">
              <h2>Atendimento que resolve sem complicação.</h2>
              <p>Rapidez, orientação para escolher a bateria certa e atendimento do começo ao fim.</p>
            </div>
            <div class="proof-grid">
              <article class="testimonial-card">
                <div class="testimonial-top"><div class="testimonial-stars">★★★★★</div><div class="testimonial-type">Atendimento no local</div></div>
                <p class="testimonial-quote">“Meu carro não ligou de manhã e eu precisava sair. Expliquei o modelo, me orientaram sobre a bateria e resolveram tudo bem rápido.”</p>
                <div class="testimonial-person"><div class="testimonial-avatar">CM</div><div><div class="testimonial-name">Carlos M.</div><div class="testimonial-meta">Cliente • exemplo de demonstração</div></div></div>
              </article>
              <article class="testimonial-card">
                <div class="testimonial-top"><div class="testimonial-stars">★★★★★</div><div class="testimonial-type">Orientação</div></div>
                <p class="testimonial-quote">“Eu não sabia qual bateria servia no meu carro. O atendimento explicou as opções com clareza e ficou bem mais fácil decidir.”</p>
                <div class="testimonial-person"><div class="testimonial-avatar">JR</div><div><div class="testimonial-name">Juliana R.</div><div class="testimonial-meta">Cliente • exemplo de demonstração</div></div></div>
              </article>
              <article class="testimonial-card">
                <div class="testimonial-top"><div class="testimonial-stars">★★★★★</div><div class="testimonial-type">Loja física</div></div>
                <p class="testimonial-quote">“Fui até a loja, fui atendido rápido e já saí com a bateria instalada. Atendimento simples, direto e profissional.”</p>
                <div class="testimonial-person"><div class="testimonial-avatar">RS</div><div><div class="testimonial-name">Rafael S.</div><div class="testimonial-meta">Cliente • exemplo de demonstração</div></div></div>
              </article>
            </div>
            <div class="demo-note"><span class="demo-dot"></span>Depoimentos ilustrativos usados somente para demonstrar o layout. Substituir por avaliações reais antes da versão final.</div>
          </div>`;
      }

      doc.querySelectorAll('.product-card').forEach(card => {
        const name = card.querySelector('h3')?.textContent.trim() || 'uma bateria';
        const primary = card.querySelector('.actions .primary');
        if (primary) {
          primary.href = waUrl(`Olá! Vi a ${name} no site da Luan Baterias e quero confirmar compatibilidade, disponibilidade e condições.`);
          primary.target = '_blank';
          primary.rel = 'noopener';
          primary.textContent = 'Consultar no WhatsApp';
        }
      });

      const contact = doc.querySelector('#contato .contact');
      if (contact) {
        contact.innerHTML = `
          <h3>Luan Baterias</h3>
          <p>Atendimento na loja em Santa Cruz — RJ e entrega conforme disponibilidade. Fale com a equipe para confirmar a bateria certa para o seu veículo.</p>
          <div class="contact-list">
            <div class="row"><div>📍</div><div><b>Endereço</b><span>${ADDRESS}</span></div></div>
            <div class="row"><div>💬</div><div><b>WhatsApp</b><span><a class="inline-link" href="${waUrl('Olá! Vim pelo site da Luan Baterias e preciso de ajuda para encontrar uma bateria.')}" target="_blank" rel="noopener">(21) 97744-9687</a></span></div></div>
            <div class="row"><div>☎</div><div><b>Telefone</b><span><a class="inline-link" href="tel:${PHONE_NUMBER}">(21) 3305-2797</a></span></div></div>
          </div>
          <a class="btn primary" href="${waUrl('Olá! Vim pelo site da Luan Baterias e preciso de ajuda para encontrar a bateria certa para meu veículo.')}" target="_blank" rel="noopener">Falar no WhatsApp</a>`;
      }

      const map = doc.querySelector('#contato .map');
      if (map) {
        const embed = `https://www.google.com/maps?q=${encodeURIComponent(MAP_QUERY)}&output=embed`;
        const route = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(MAP_QUERY)}`;
        map.innerHTML = `<iframe src="${embed}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Mapa da Luan Baterias"></iframe><a class="map-route" href="${route}" target="_blank" rel="noopener">Abrir rota</a>`;
      }

      doc.querySelectorAll('.footer a').forEach(link => {
        if (link.textContent.toLowerCase().includes('cabr')) {
          link.textContent = 'Rua do Império, 166 - Santa Cruz - RJ';
          link.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(MAP_QUERY)}`;
          link.target = '_blank';
          link.rel = 'noopener';
        }
      });

      const finalCta = doc.querySelector('.cta .primary');
      if (finalCta) {
        finalCta.textContent = 'Falar com a Luan Baterias';
        finalCta.href = waUrl('Olá! Vim pelo site da Luan Baterias e quero encontrar a bateria certa para meu veículo.');
        finalCta.target = '_blank';
        finalCta.rel = 'noopener';
      }

      if (!doc.querySelector('.wa-float')) {
        const float = doc.createElement('a');
        float.className = 'wa-float';
        float.href = waUrl('Olá! Vim pelo site da Luan Baterias e preciso de atendimento.');
        float.target = '_blank';
        float.rel = 'noopener';
        float.setAttribute('aria-label', 'Falar com a Luan Baterias pelo WhatsApp');
        float.innerHTML = '<span>💬</span> WhatsApp';
        doc.body.appendChild(float);
      }

      const heroFrame = doc.getElementById('site');
      const configureHero = () => {
        const heroDoc = heroFrame?.contentDocument || heroFrame?.contentWindow?.document;
        if (!heroDoc) return;

        [...heroDoc.querySelectorAll('a,button')].forEach(el => {
          if (el.textContent.trim().toLowerCase().includes('whatsapp')) {
            if (el.tagName === 'A') {
              el.href = waUrl('Olá! Vim pelo site da Luan Baterias e preciso de atendimento.');
              el.target = '_blank';
              el.rel = 'noopener';
            } else {
              el.onclick = () => window.open(waUrl('Olá! Vim pelo site da Luan Baterias e preciso de atendimento.'), '_blank');
            }
          }
        });

        const searchButton = heroDoc.querySelector('.search-submit');
        if (searchButton && !searchButton.dataset.waConnected) {
          searchButton.dataset.waConnected = 'true';
          searchButton.addEventListener('click', (event) => {
            event.preventDefault();
            const labels = ['Marca', 'Modelo', 'Ano', 'Motorização'];
            const selects = [...heroDoc.querySelectorAll('.field select')];
            const parts = selects.map((select, index) => {
              const value = select.selectedOptions?.[0]?.textContent?.trim() || '';
              if (!value || /selecione|escolha/i.test(value)) return null;
              return `${labels[index] || `Campo ${index + 1}`}: ${value}`;
            }).filter(Boolean);
            const vehicle = parts.length ? parts.join(' | ') : 'Ainda não preenchi todos os dados do veículo';
            const message = `Olá! Vim pelo site da Luan Baterias e quero encontrar a bateria certa. ${vehicle}.`;
            window.open(waUrl(message), '_blank');
          }, true);
        }
      };

      if (heroFrame) {
        heroFrame.addEventListener('load', configureHero);
        try { configureHero(); } catch (_) {}
      }

      const resizePage = () => {
        const height = Math.max(doc.body?.scrollHeight || 0, doc.documentElement?.scrollHeight || 0, 840);
        page.style.height = `${height}px`;
      };
      resizePage();
      setTimeout(resizePage, 300);
      setTimeout(resizePage, 1200);
      if ('ResizeObserver' in window) {
        const observer = new ResizeObserver(resizePage);
        observer.observe(doc.documentElement);
      }
    });
  </script>
</body>
</html>
